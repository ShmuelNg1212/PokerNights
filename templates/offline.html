<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1e1813">
  <title>You're offline · PokerNights</title>
  <link rel="icon" href="data:,">
  <style>
    html { background: #130e0a; color: #f0e7d6; font: 500 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
    main { width: 100%; max-width: 440px; text-align: center; }
    h1 { margin: 16px 0 8px; font-size: 1.75rem; font-weight: 800; line-height: 1.1; }
    p { margin: 0 0 24px; color: #b4a997; }
    a, button { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; box-sizing: border-box; margin-top: 12px;
      border-radius: 15px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    a { background: #f0e7d6; color: #1b120b; border: 1px solid #f0e7d6; box-shadow: 0 3px 0 #8f8573; }
    button { background: transparent; color: #f0e7d6; border: 1px solid #7a6f67; }
    a:focus-visible, button:focus-visible { outline: 3px solid #ebbd57; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#191511"/><circle cx="32" cy="32" r="25" fill="none" stroke="#efe6d3" stroke-width="10"/><circle cx="32" cy="32" r="25" fill="none" stroke="#191511" stroke-width="10.5" stroke-dasharray="7 19.18" stroke-dashoffset="3.5" transform="rotate(-90 32 32)"/><path fill="#e9bd55" d="M30.95 21A11.5 11.5 0 1 0 41.64 36.86A9.6 9.6 0 0 1 30.95 21Z"/></svg>
    <h1>You're offline</h1>
    <p>PokerNights needs a connection. Nothing was saved while you were offline. Reconnect, then try again.</p>
    <a href="" id="retry">Try again</a>
    <button type="button" id="back" hidden>Go back</button>
  </main>
  <script>
    var back = document.getElementById("back");
    if (history.length > 1) { back.hidden = false; back.addEventListener("click", function () { history.back(); }); }
    document.getElementById("retry").addEventListener("click", function (event) { event.preventDefault(); location.reload(); });
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
