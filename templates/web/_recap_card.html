{% load money_tags table_tags %}
{# The way into the recap, directly under what this person pays or gets (the human, 2026-11-20). The recap never opens by itself. #}
<div class="row-card press-card recap-card" data-recap-card><button type="button" class="card-link" data-sheet-open="recap"><span class="grow"><strong>Session recap</strong> <span class="recap-card-line">{% if recap.winners %}<span>{% for winner in recap.winners %}{{ winner.member.display_name }}{% if not forloop.last %}, {% endif %}{% endfor %} <span class="amount plus">{{ recap.winners.0.net|signed_amount:unit }}</span></span> · {% endif %}<span class="recap-card-fact">{{ recap.players }} player{{ recap.players|pluralize }}</span> · <span class="recap-card-fact">{{ recap.set_count }} set{{ recap.set_count|pluralize }}</span></span></span>{% icon 'chevron-right' %}</button></div>
