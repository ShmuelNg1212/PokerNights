<div class="copy-wrap">
  <input type="text" readonly id="{{ id }}" value="{{ url }}" aria-label="{{ label }}" onfocus="this.select()">
  <button type="button" class="copy-button" data-copy="{{ id }}" aria-label="Copy link" hidden>Copy</button>
</div>
<p class="copy-status visually-hidden" data-copy-status="{{ id }}" role="status"></p>
