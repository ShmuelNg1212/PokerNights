{% load money_tags table_tags %}
<form method="post" action="{% url 'buy_in_add' session.pk %}" class="stack buy-form" data-once>{% csrf_token %}{% request_id_field %}
  <input type="hidden" name="participant_id" value="{{ p.pk }}">
  <label>Amount {% if unit == 'chips' %}(chips){% else %}(pesos){% endif %}
    <input class="sheet-amount" type="text" name="amount" data-keep="buy-in-{{ p.pk }}" inputmode="decimal" autocomplete="off" value="{{ default_buy_in }}" required aria-label="Buy-in amount for {{ p.member.display_name }}">
  </label>
  <div class="quick-amounts" aria-label="Quick amounts">
    <button type="button" class="btn btn-small" data-amount="{{ settings.min_buy_in|plain:unit }}">Min</button>
    <button type="button" class="btn btn-small" data-amount="{{ default_buy_in }}">Default</button>
    <button type="button" class="btn btn-small" data-amount="{% double_default settings unit %}">2 ×</button>
    <button type="button" class="btn btn-small" data-amount="{{ settings.max_buy_in|plain:unit }}">Max</button>
  </div>
  <p class="hint">Allowed: {{ settings.min_buy_in|amount:unit }}–{{ settings.max_buy_in|amount:unit }}. Default: {{ settings.default_buy_in|amount:unit }}.</p>
  <p class="hint">{% include "web/_rake_rule.html" %}</p>
  <button type="submit" class="btn btn-primary btn-block">{% if line.has_money %}Confirm rebuy{% else %}Confirm buy-in{% endif %}</button>
</form>
