{% extends "base.html" %}
{% block title %}Settings · {{ session }}{% endblock %}
{% block content %}
<p class="small"><a href="{% url 'session' session.pk %}">← Back to the game</a></p>
<h1>Game settings</h1>
<p class="muted">Type each amount in the game's unit. Buy-ins already recorded keep their amounts.</p>
<form method="post" class="card stack">
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  <button type="submit" class="btn btn-primary btn-block">Save settings</button>
</form>
{% endblock %}
