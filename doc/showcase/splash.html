<!doctype html>
<!-- PokerNights launch screen for the installed app on an iPhone. web/tests/browser/make_splash.mjs renders it
     at each screen size in config/pwa.py to static/splash/. It uses the app's own stylesheet and the front door's
     mark (templates/partials/mark.html, copied), so the launch is the front door's hero: the stacked chip and the
     name on Ground, the colour of the first paint. The group sits a little above the middle, where the eye rests. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokerNights launch screen</title>
<link rel="stylesheet" href="../../static/css/app.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--ground); }
  .splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: var(--s-2); padding-bottom: 9vh; }
  .splash .door-mark { width: 96px; }
</style>
</head>
<body>
<div class="splash">
  <svg class="door-mark" viewBox="0 0 64 67" aria-hidden="true" focusable="false">
    <circle class="door-disc" cx="32" cy="32" r="32"/>
    <g class="door-under"><circle class="door-band" cx="32" cy="35" r="25"/><circle class="door-notch" cx="32" cy="35" r="25" transform="rotate(-90 32 35)"/></g>
    <circle class="door-disc" cx="32" cy="32" r="20.5"/>
    <g class="door-ring"><circle class="door-band" cx="32" cy="32" r="25"/><circle class="door-notch" cx="32" cy="32" r="25" transform="rotate(-90 32 32)"/></g>
    <path class="door-moon" d="M30.95 21A11.5 11.5 0 1 0 41.64 36.86A9.6 9.6 0 0 1 30.95 21Z"/>
  </svg>
  <p class="entry-name">PokerNights</p>
</div>
</body>
</html>
