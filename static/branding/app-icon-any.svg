<!-- PokerNights icon on a clear ground, for the manifest's "any" icons: Android draws its launch screen from it on the manifest's background colour. The chip fills the middle two thirds, the circle Android 12 and later keep. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="PokerNights">
  <g transform="translate(16 16)">
    <circle cx="32" cy="32" r="32" fill="#191511"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#efe6d3" stroke-width="10"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#191511" stroke-width="10.5" stroke-dasharray="7 19.18" stroke-dashoffset="3.5" transform="rotate(-90 32 32)"/>
    <path fill="#e9bd55" d="M30.95 21A11.5 11.5 0 1 0 41.64 36.86A9.6 9.6 0 0 1 30.95 21Z"/>
  </g>
</svg>
